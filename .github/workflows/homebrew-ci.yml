name: Homebrew CI

on:
  push:
    branches:
      - main
    paths:
      - "Formula/**"
      - "Casks/**"
      - "update.sh"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "Formula/**"
      - "Casks/**"
      - "update.sh"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: homebrew-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Audit tap
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1

      - name: Check update script syntax
        run: bash -n update.sh

      - name: Check style
        run: brew style Formula/see.rb Casks/see-desktop.rb

      - name: Audit Formula
        run: brew audit --strict --online --formula see

      - name: Audit Cask
        run: brew audit --strict --online --cask see-desktop

  test-formula:
    name: Test Formula
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1

      - name: Prepare test environment
        run: |
          brew test-bot --only-cleanup-before
          brew test-bot --only-setup

      - name: Install and test Formula
        run: brew test-bot --only-formulae sdotee/tap/see

  test-cask:
    name: Test Cask
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1

      - name: Install Cask
        run: brew install --cask see-desktop

      - name: Uninstall Cask
        run: brew uninstall --cask see-desktop
