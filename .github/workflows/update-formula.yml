name: Update Formula

on:
  schedule:
    - cron: "0 8 * * *" # Daily at 08:00 UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Check for new release
        id: check
        run: |
          REPO="sdotee/cli"
          LATEST_TAG=$(curl -s "https://api.github.com/repos/${REPO}/releases/latest" | jq -r '.tag_name')
          LATEST_VERSION="${LATEST_TAG#v}"
          CURRENT_VERSION=$(grep 'SEE_VERSION' Formula/see.rb | head -1 | sed 's/.*"\(.*\)".*/\1/')

          echo "current=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Current: ${CURRENT_VERSION}, Latest: ${LATEST_VERSION}"

          if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update formula
        if: steps.check.outputs.updated == 'true'
        run: |
          VERSION="${{ steps.check.outputs.latest }}"
          REPO="sdotee/cli"
          TMPDIR_PATH=$(mktemp -d)
          trap 'rm -rf "$TMPDIR_PATH"' EXIT

          # Download checksums
          echo "Downloading checksums for v${VERSION}..."
          CHECKSUMS=$(curl -sL "https://github.com/${REPO}/releases/download/v${VERSION}/checksums.txt")
          SHA256_INTEL=$(echo "$CHECKSUMS" | grep 'see_Darwin_x86_64.tar.gz' | awk '{print $1}')
          SHA256_ARM=$(echo "$CHECKSUMS" | grep 'see_Darwin_arm64.tar.gz' | awk '{print $1}')

          if [ -z "$SHA256_INTEL" ] || [ -z "$SHA256_ARM" ]; then
            echo "::error::Could not find Darwin checksums in checksums.txt"
            exit 1
          fi

          # Verify Intel checksum
          echo "Verifying Intel binary..."
          curl -sL "https://github.com/${REPO}/releases/download/v${VERSION}/see_Darwin_x86_64.tar.gz" -o "${TMPDIR_PATH}/intel.tar.gz"
          ACTUAL_INTEL=$(sha256sum "${TMPDIR_PATH}/intel.tar.gz" | awk '{print $1}')
          if [ "$SHA256_INTEL" != "$ACTUAL_INTEL" ]; then
            echo "::error::Intel SHA256 mismatch! Expected: ${SHA256_INTEL}, Actual: ${ACTUAL_INTEL}"
            exit 1
          fi
          echo "  Intel OK: ${SHA256_INTEL}"

          # Verify ARM checksum
          echo "Verifying ARM binary..."
          curl -sL "https://github.com/${REPO}/releases/download/v${VERSION}/see_Darwin_arm64.tar.gz" -o "${TMPDIR_PATH}/arm.tar.gz"
          ACTUAL_ARM=$(sha256sum "${TMPDIR_PATH}/arm.tar.gz" | awk '{print $1}')
          if [ "$SHA256_ARM" != "$ACTUAL_ARM" ]; then
            echo "::error::ARM SHA256 mismatch! Expected: ${SHA256_ARM}, Actual: ${ACTUAL_ARM}"
            exit 1
          fi
          echo "  ARM OK: ${SHA256_ARM}"

          # Update Formula
          sed -i "s/SEE_VERSION = \".*\"/SEE_VERSION = \"${VERSION}\"/" Formula/see.rb
          sed -i "s/SHA256_INTEL = \".*\"/SHA256_INTEL = \"${SHA256_INTEL}\"/" Formula/see.rb
          sed -i "s/SHA256_ARM = \".*\"/SHA256_ARM = \"${SHA256_ARM}\"/" Formula/see.rb

          echo "Updated Formula/see.rb to v${VERSION}"
          grep -E '(SEE_VERSION|SHA256_)' Formula/see.rb

      - name: Commit and push
        if: steps.check.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/see.rb
          git commit -m "Update see to v${{ steps.check.outputs.latest }}"
          git push
