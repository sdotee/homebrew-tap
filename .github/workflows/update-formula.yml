name: Update Formula and Cask

on:
  schedule:
    - cron: "0 8 * * *" # Daily at 08:00 UTC
  workflow_dispatch:

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    # macOS: the formula only defines macOS URLs, so brew audit fails on Linux
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1

      - name: Check and update Formula and Cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash update.sh

      - name: Validate Formula and Cask
        run: |
          brew style Formula/see.rb Casks/see-desktop.rb
          brew audit --strict --online --formula see
          brew audit --strict --online --cask see-desktop

      # Always commit a timestamp so the repo stays active and GitHub
      # doesn't disable this scheduled workflow after 60 days.
      - name: Record check timestamp and build commit message
        id: msg
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/LAST_CHECK
          FORMULA_VER=$(grep 'SEE_VERSION' Formula/see.rb | head -1 | sed 's/.*"\(.*\)".*/\1/')
          CASK_VER=$(grep -E '^  version ' Casks/see-desktop.rb | head -1 | sed 's/.*"\(.*\)".*/\1/')
          CHANGES=()
          git diff --quiet Formula/see.rb || CHANGES+=("see v${FORMULA_VER}")
          git diff --quiet Casks/see-desktop.rb || CHANGES+=("see-desktop v${CASK_VER}")
          if [ ${#CHANGES[@]} -gt 0 ]; then
            MSG="chore: update $(IFS=,; echo "${CHANGES[*]}" | sed 's/,/, /g')"
          else
            MSG="chore: daily version check $(date -u +%Y-%m-%d)"
          fi
          echo "message=${MSG}" >> "$GITHUB_OUTPUT"

      # checkout@v7 keeps credentials outside .git/config, which git on the
      # macOS runner doesn't pick up; set the token on the remote explicitly.
      - name: Configure push credentials
        run: git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: ${{ steps.msg.outputs.message }}
          file_pattern: "Formula/see.rb Casks/see-desktop.rb .github/LAST_CHECK"
